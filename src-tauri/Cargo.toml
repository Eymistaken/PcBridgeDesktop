[package]
name = "pcbridge-desktop"
version = "0.1.0"
description = "pcbridge MCP sunucusunun masaüstü istemcisi"
authors = ["eymistaken"]
edition = "2021"

[lib]
name = "pcbridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
keyring = "4"
portable-pty = "0.9"
# PTY baytları JSON'dan geçerken bozulmasın: UTF-8 sınırı ve kaçış
# dizileri parça sınırına denk gelebiliyor.
base64 = "0.22"
# Yalnızca bağlantı hatasını sınıflandırmak için — rmcp zaten ağaçta tutuyor.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "3.2", default-features = false, features = [
  "client",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
