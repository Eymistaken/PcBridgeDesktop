[package]
name = "pcbridge-desktop"
version = "0.2.0"
description = "pcbridge MCP sunucusunun masaüstü istemcisi"
authors = ["eymistaken"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/Eymistaken/PcBridgeDesktop"

[lib]
name = "pcbridge_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "rt"] }
keyring = "4"
portable-pty = "0.9"
# PTY baytları JSON'dan geçerken bozulmasın: UTF-8 sınırı ve kaçış
# dizileri parça sınırına denk gelebiliyor.
base64 = "0.22"
# Bağlantı hatasını sınıflandırmak **ve** model akışını okumak için.
# `stream` özelliği gerekmiyor: `Response::chunk()` özellik kapısının dışında
# (reqwest-0.13.4/src/async_impl/response.rs:310 — ölçüldü), SSE onunla
# okunuyor ve futures-util'e hiç girilmiyor.
reqwest = { version = "0.13", default-features = false, features = ["json"] }
rmcp = { version = "3.2", default-features = false, features = [
  "client",
  "transport-streamable-http-client-reqwest",
  "reqwest",
] }

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
